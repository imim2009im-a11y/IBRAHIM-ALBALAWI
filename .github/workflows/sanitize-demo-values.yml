name: Sanitize demo values

on:
  push:
    branches:
      - codex/remove-secret-like-demo-values
    paths:
      - .github/workflows/sanitize-demo-values.yml

permissions:
  contents: write

concurrency:
  group: sanitize-demo-values-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sanitize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Replace credential-like demo payloads
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/App.tsx')
          text = path.read_text()
          patterns = [
              (r'("temp-demo/secrets\.env"\s*:\s*)"[^"]*"', r'\1"DEMO_VALUES_REDACTED"'),
              (r'(files\.set\("temp-demo/secrets\.env"\s*,\s*)"[^"]*"\)', r'\1"DEMO_VALUES_REDACTED")'),
          ]
          total = 0
          for pattern, replacement in patterns:
              text, count = re.subn(pattern, replacement, text)
              total += count
          if total != 2:
              raise SystemExit(f'Expected exactly 2 demo payload replacements, found {total}')
          path.write_text(text)
          PY

      - name: Verify change scope
        shell: bash
        run: |
          changed="$(git diff --name-only | sort)"
          if [ "$changed" != "src/App.tsx" ]; then
            echo "Unexpected files changed:"
            printf '%s\n' "$changed"
            exit 1
          fi
          count="$(grep -o 'DEMO_VALUES_REDACTED' src/App.tsx | wc -l | tr -d ' ')"
          test "$count" = "2"

      - name: TypeScript check
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Commit verified sanitization
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git rm .github/workflows/sanitize-demo-values.yml
          git commit -m "security: sanitize credential-like demo values"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:${GITHUB_REF_NAME}"
