name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned from v4
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # pinned from v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Scrub demo credentials from built assets
        run: |
          set -euo pipefail
          find dist -type f \( -name "*.js" -o -name "*.html" -o -name "*.css" \) -print0 \
            | xargs -0 sed -i \
              -e 's/GEMINI_API_KEY=ai_studio_active_session_token_xyz_9988/GEMINI_API_KEY=DEMO_KEY_REDACTED/g' \
              -e 's#DATABASE_URL=postgresql://sandbox_admin:highly_secure_pass@localhost:5432#DATABASE_URL=postgresql://demo_user:demo_password@localhost:5432#g'

          if grep -R "ai_studio_active_session_token_xyz_9988\|highly_secure_pass" dist; then
            echo "Sensitive demo credentials are still present in built assets. Failing deploy."
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # pinned from v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # pinned from v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # pinned from v4